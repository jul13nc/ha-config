# Dashboard mobile : plans découpés en deux moitiés (gauche/droite) par étage.
# Généré automatiquement depuis dashboards/maison.yaml.
# Les PNG sont dans www/plans/ : home-assistant-<etage>-<gauche|droite>.png
title: Plans mobile
views:
- title: RDC gauche
  path: rdc-gauche
  type: panel
  cards:
  - type: picture-elements
    image: /local/plans/home-assistant-rdc-gauche.png
    elements:
    - type: state-label
      entity: sensor.th_garage_temperature
      title: Température garage
      tap_action:
        action: more-info
      style:
        left: 52.351%
        top: 83.626%
        color: '#d2f3ff'
        font-weight: '600'
        font-size: clamp(13px, 1.8vw, 24px)
        white-space: nowrap
    - type: state-label
      entity: sensor.th_ch_parents_temperature
      title: Température chambre RDC
      tap_action:
        action: more-info
      style:
        left: 22.003%
        top: 47.087%
        color: '#d2f3ff'
        font-weight: '600'
        font-size: clamp(13px, 1.8vw, 24px)
        white-space: nowrap
    - type: state-icon
      entity: cover.volet_roulant_parents
      title: Volet chambre RDC
      state_color: true
      tap_action:
        action: more-info
      style:
        left: 9.104%
        top: 36.91%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
- title: RDC droite
  path: rdc-droite
  type: panel
  cards:
  - type: picture-elements
    image: /local/plans/home-assistant-rdc-droite.png
    elements:
    - type: state-label
      entity: sensor.th_salon_temperature
      title: Température salon
      tap_action:
        action: more-info
      style:
        left: 64.644%
        top: 49.399%
        color: '#d2f3ff'
        font-weight: '600'
        font-size: clamp(13px, 1.8vw, 24px)
        white-space: nowrap
    - type: state-label
      entity: sensor.th_ext_temperature
      title: Température extérieure
      tap_action:
        action: more-info
      style:
        left: 23.672%
        top: 81.314%
        color: '#d2f3ff'
        font-weight: '600'
        font-size: clamp(13px, 1.8vw, 24px)
        white-space: nowrap
    - type: state-icon
      entity: light.lampetele
      title: Luminaire salon 1 — mur droit, au-dessus de la baie
      icon: mdi:lightbulb
      state_color: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 87.527%
        top: 36.752%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: light.lampecanape
      title: Luminaire salon 2 — mur sous la porte-fenêtre cuisine
      icon: mdi:lightbulb
      state_color: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 60.091%
        top: 33.21%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: light.lampebuffet
      title: Luminaire salon 3 — mur bas, coin opposé à la cuisine
      icon: mdi:lightbulb
      state_color: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 82.852%
        top: 69.288%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: light.lampeflechettes
      title: Luminaire salon 4 — entre entrée et porte-fenêtre
      icon: mdi:lightbulb
      state_color: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 37.329%
        top: 69.288%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: vacuum.robot_aspirateur
      title: Aspirateur robot — près de la SDB et du dégagement
      icon: mdi:robot-vacuum
      tap_action:
        action: more-info
      style:
        left: 6.981%
        top: 55.874%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: cover.volet_roulant_salon
      title: Volet salon — fenêtre est
      state_color: true
      tap_action:
        action: more-info
      style:
        left: 90.440%
        top: 53.1%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: state-icon
      entity: camera.ezviz_hpd7_bk0229016_bk0227784_direct
      title: Visiophone — ouvrir le portail ou le portillon
      icon: mdi:doorbell-video
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Visiophone
            icon: mdi:doorbell-video
            content:
              type: vertical-stack
              cards:
              - type: picture-entity
                show_state: false
                show_name: false
                camera_view: auto
                fit_mode: cover
                entity: camera.ezviz_hpd7_bk0229016_bk0227784_direct
                camera_image: camera.ezviz_hpd7_bk0229016_bk0227784_directhe
              - type: horizontal-stack
                cards:
                - type: button
                  entity: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portail
                  name: Portail
                  icon: mdi:gate
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portail
                    confirmation:
                      text: Ouvrir le portail ?
                - type: button
                  entity: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portillon
                  name: Portillon
                  icon: mdi:door
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portillon
                    confirmation:
                      text: Ouvrir le portillon ?
      hold_action:
        action: more-info
      style:
        left: 18.938%
        top: 64.57%
        color: '#83b1c9'
        --mdc-icon-size: clamp(24px, 2.8vw, 34px)
    - type: custom:meteofrance-weather-card
      entity: weather.mionnay
      current: false
      details: false
      alert_forecast: false
      one_hour_forecast: false
      hourly_forecast: true
      number_of_hourly_forecasts: '4'
      daily_forecast: false
      hourly_details: false
      animated_icons: true
      cloudCoverEntity: sensor.mionnay_cloud_cover
      rainChanceEntity: sensor.mionnay_rain_chance
      freezeChanceEntity: sensor.mionnay_freeze_chance
      snowChanceEntity: sensor.mionnay_snow_chance
      uvEntity: sensor.mionnay_uv
      rainForecastEntity: sensor.mionnay_next_rain
      alertEntity: sensor.01_weather_alert
      style:
        left: 67.830%
        top: 89.5%
        width: 59.332%
        --ha-card-background: transparent
        --ha-card-box-shadow: none
        --primary-text-color: '#d2f3ff'
        --secondary-text-color: '#83b1c9'
