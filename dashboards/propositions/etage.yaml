- type: grid
  cards:
    - type: heading
      heading: Gaetan
      icon: mdi:bed-outline
    - type: glance
      show_name: false
      columns: 2
      entities:
        - entity: sensor.th_ch_gaetan_temperature
          icon: mdi:thermometer
          tap_action:
            action: more-info
        - entity: sensor.th_ch_gaetan_humidity
          icon: mdi:water-percent
          tap_action:
            action: more-info
    - type: tile
      entity: cover.volet_roulant_gaetan
      name: Volet Gaetan
      grid_options:
        columns: 12
        rows: auto
      features:
        - type: cover-open-close
