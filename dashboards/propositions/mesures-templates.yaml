# button-card est déjà utilisé par le dashboard global.
mesure_compacte:
  show_name: false
  show_state: true
  show_units: true
  tap_action:
    action: more-info
  styles:
    card:
      - height: 44px
      - padding: 4px 8px
      - box-sizing: border-box
    grid:
      - grid-template-areas: '"i s"'
      - grid-template-columns: 24px minmax(0, 1fr)
      - grid-template-rows: 1fr
      - column-gap: 6px
    icon:
      - width: 22px
      - color: var(--primary-color)
    state:
      - font-size: 24px
      - font-weight: 600
      - justify-self: center
