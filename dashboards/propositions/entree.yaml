type: grid
cards:
  - type: heading
    heading: Entrée et extérieur
    icon: mdi:doorbell-video
  - type: button
    entity: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portail
    name: Ouvrir portail
    icon: mdi:gate
    show_state: false
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portail
      confirmation:
        text: Ouvrir le portail ?
  - type: button
    entity: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portillon
    name: Ouvrir portillon
    icon: mdi:door
    show_state: false
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.ezviz_hpd7_bk0229016_bk0227784_ouvrir_portillon
      confirmation:
        text: Ouvrir le portillon ?
  - type: glance
    show_name: false
    columns: 2
    entities:
      - entity: sensor.th_ext_temperature
        icon: mdi:thermometer
        tap_action:
          action: more-info
      - entity: sensor.th_ext_humidity
        icon: mdi:water-percent
        tap_action:
          action: more-info
  - type: weather-forecast
    entity: weather.mionnay
    forecast_type: hourly
